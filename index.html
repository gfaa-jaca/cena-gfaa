<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e6">
<title>Cena GFAA 2026</title>
<link rel="icon" href="logo.png">
<style>
  html, body { margin:0; height:100%; background:#f7f1e6; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
            background:#f7f1e6; transition:opacity .4s; z-index:2; }
  #splash img { width:min(55vw,220px); height:auto; }
  #splash .r { width:min(55vw,220px); height:8px; background:linear-gradient(90deg,#671c30 0 20%,#c4322a 20% 40%,#eec623 40% 60%,#c4cf32 60% 80%,#b9d9ea 80% 100%); }
  #f { position:fixed; inset:0; width:100%; height:100%; border:0; background:#f7f1e6; }
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="Grupo Folklórico Alto Aragón"><div class="r"></div></div>
<iframe id="f" title="Cena GFAA 2026" allow="camera; clipboard-write; web-share"></iframe>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbydStY3sb0TydIJMO4BqYWziKLBRm_7M2dFVQJ08i1hz16dEe0PnIaK1vbZI54hGfY/exec';
  var base = location.origin + location.pathname;
  var extra = location.search ? '&' + location.search.slice(1) : '';
  var f = document.getElementById('f');
  f.onload = function () {
    var s = document.getElementById('splash');
    s.style.opacity = 0;
    setTimeout(function () { s.style.display = 'none'; }, 450);
  };
  f.src = EXEC + '?host=' + encodeURIComponent(base) + extra;
</script>
</body>
</html>
